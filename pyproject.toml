[project]
name = "leadpulse360"
version = "0.1.0"
description = "Automated Enterprise Lead Decision & Triage Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "email-validator>=2.0.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

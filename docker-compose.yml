services:
  leadpulse-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: leadpulse360:latest
    container_name: leadpulse-api
    restart: unless-stopped
    command: ["uvicorn", "leadpulse.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - LEADPULSE_AUDIT_LOG_PATH=/app/data/audit.jsonl
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - leadpulse-net

  leadpulse-dashboard:
    image: leadpulse360:latest
    container_name: leadpulse-dashboard
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - LEADPULSE_AUDIT_LOG_PATH=/app/data/audit.jsonl
    depends_on:
      leadpulse-api:
        condition: service_healthy
    networks:
      - leadpulse-net

networks:
  leadpulse-net:
    driver: bridge
